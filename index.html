<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OR Schedule · KSH</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--border2:#3d4550;
  --text:#e6edf3;--muted:#7d8590;--muted2:#9198a1;
  --warn:#e3b341;--warnbg:rgba(227,179,65,.12);
}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;min-height:100vh;padding:0;}
button,select,input{font-family:inherit;}

/* ── DEPT COLORS ── */
.dept-obstetrics  {--dc:#f78166;--db:rgba(247,129,102,.15);}
.dept-surgery     {--dc:#58a6ff;--db:rgba(88,166,255,.15);}
.dept-orthopedics {--dc:#3fb950;--db:rgba(63,185,80,.15);}
.dept-ophthalmology{--dc:#e3b341;--db:rgba(227,179,65,.15);}
.dept-neurosurgery{--dc:#d2a8ff;--db:rgba(210,168,255,.15);}
.dept-maxillo     {--dc:#79c0ff;--db:rgba(121,192,255,.15);}

.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:200;}
.spinner{width:30px;height:30px;border:3px solid var(--border2);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── LOGIN ── */
.login-wrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:32px 28px;width:340px;max-width:100%;text-align:center;}
.login-logo{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;}
.login-title{font-size:1.3rem;font-weight:800;margin-bottom:4px;}
.login-sub{font-size:.8rem;color:var(--muted);margin-bottom:28px;}
.login-input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:11px 14px;border-radius:8px;font-size:1rem;outline:none;text-align:center;letter-spacing:.12em;margin-bottom:10px;}
.login-input:focus{border-color:#58a6ff;}
.login-err{font-size:.75rem;color:#f78166;min-height:18px;margin-bottom:8px;}
.login-btn{width:100%;padding:11px;border:none;border-radius:8px;background:#58a6ff;color:#0d1117;font-weight:700;font-size:.95rem;cursor:pointer;transition:opacity .15s;}
.login-btn:hover{opacity:.85;}

/* ── MAIN LAYOUT ── */
.app{display:none;min-height:100vh;flex-direction:column;}
.app.show{display:flex;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.dept-badge{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid var(--dc);background:var(--db);color:var(--dc);}
.topbar-title{font-size:1rem;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;}
.sync-txt{font-size:.7rem;color:var(--muted);}
.sync-msg{font-size:.7rem;font-family:'IBM Plex Mono',monospace;min-height:16px;}
.btn-sm{padding:5px 12px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--muted2);cursor:pointer;font-size:.8rem;white-space:nowrap;}
.btn-sm:hover{background:var(--surface2);}
.btn-sm.active{border-color:#58a6ff;color:#58a6ff;background:rgba(88,166,255,.1);}

/* ── TABS ── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 18px;}
.tab{padding:10px 18px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px;}
.tab.active{color:var(--text);border-bottom-color:#58a6ff;}
.tab-content{display:none;padding:16px 18px;flex:1;}
.tab-content.show{display:block;}

/* ── CONTROLS ── */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;}
.ctrl-group{display:flex;flex-direction:column;gap:4px;}
.ctrl-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.month-nav{display:flex;align-items:center;gap:6px;}
.month-label{min-width:105px;text-align:center;font-weight:700;font-size:.88rem;}
.nav-btn{padding:5px 9px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;font-size:.95rem;}
.pill-row{display:flex;gap:5px;flex-wrap:wrap;}
.pill{padding:5px 11px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s;white-space:nowrap;}
.pill.active{color:var(--dc,#58a6ff);border-color:var(--dc,#58a6ff);background:var(--db,rgba(88,166,255,.12));}
.btn-ghost{padding:6px 12px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--muted2);cursor:pointer;font-size:.82rem;white-space:nowrap;}
.btn-ghost:hover{opacity:.75;}

.conflict-banner{background:var(--warnbg);border:1px solid var(--warn);border-radius:7px;padding:7px 12px;font-size:.78rem;color:var(--warn);margin-bottom:12px;display:none;}
.conflict-banner.show{display:block;}

/* ── SLOT GRID ── */
.slot-grid{display:flex;flex-direction:column;gap:10px;}
.slot-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.slot-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);}
.slot-header-left{display:flex;align-items:center;gap:8px;}
.slot-room{font-size:.85rem;font-weight:700;color:var(--text);}
.slot-time{font-size:.72rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.slot-day{font-size:.75rem;font-weight:600;}
.slot-body{padding:10px 14px;min-height:54px;}

/* ── OP ITEM ── */
.op-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border-radius:7px;margin-bottom:6px;cursor:pointer;border-left:3px solid var(--dc,#58a6ff);transition:filter .1s;}
.op-item:hover{filter:brightness(1.15);}
.op-item:last-child{margin-bottom:0;}
.op-info{flex:1;min-width:0;}
.op-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.op-meta{font-size:.7rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.op-doc{font-size:.75rem;color:var(--dc,#58a6ff);font-weight:600;}
.add-btn{width:100%;padding:8px;border:1px dashed var(--border2);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-size:.82rem;text-align:center;transition:all .15s;margin-top:4px;}
.add-btn:hover{border-color:var(--dc,#58a6ff);color:var(--dc,#58a6ff);}

/* ── SUMMARY TABLE ── */
.summary-title{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 7px;}
.summary-table{background:var(--surface);border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.s-row{display:grid;grid-template-columns:55px 70px 80px 1fr 60px;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:.78rem;cursor:pointer;transition:background .1s;}
.s-row:last-child{border-bottom:none;}
.s-row:hover{background:var(--surface2);}
.s-room,.s-time{font-family:'IBM Plex Mono',monospace;color:var(--muted2);display:flex;align-items:center;}
.s-doc{font-weight:700;display:flex;align-items:center;}
.s-op{color:var(--text);display:flex;align-items:center;}
.s-dur{font-family:'IBM Plex Mono',monospace;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;}

/* ── CENTRAL VIEW ── */
.central-grid{display:flex;flex-direction:column;gap:8px;}
.cv-room{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.cv-room-header{padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:.85rem;font-weight:700;}
.cv-sessions{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.cv-session{padding:8px 12px;border-right:1px solid var(--border);}
.cv-session:last-child{border-right:none;}
.cv-sess-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.cv-op{padding:5px 8px;border-radius:5px;margin-bottom:4px;border-left:3px solid;font-size:.75rem;}
.cv-op:last-child{margin-bottom:0;}
.cv-op-doc{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cv-op-name{color:#c9d1d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cv-empty{font-size:.72rem;color:var(--border2);font-style:italic;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);}
.overlay.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:22px;width:380px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:.95rem;font-weight:700;margin-bottom:16px;}
.modal-sub{font-size:.68rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-left:6px;font-weight:400;}
.form-row{margin-bottom:12px;}
.form-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:block;}
.fsel,.finput{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 11px;border-radius:7px;font-family:inherit;font-size:.85rem;outline:none;}
.finput{margin-top:7px;display:none;}
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dur-hint{font-size:.7rem;margin-top:4px;font-family:'IBM Plex Mono',monospace;}
.conflict-msg{background:var(--warnbg);border:1px solid var(--warn);border-radius:5px;padding:6px 10px;font-size:.73rem;color:var(--warn);margin-bottom:10px;display:none;}
.conflict-msg.show{display:block;}
.modal-actions{display:flex;gap:7px;margin-top:16px;justify-content:flex-end;}
.btn-primary{padding:8px 16px;border:none;border-radius:7px;background:#58a6ff;color:#0d1117;font-weight:700;cursor:pointer;font-size:.83rem;}
.btn-cancel{padding:8px 12px;border:1px solid var(--border2);border-radius:7px;background:transparent;color:var(--muted2);cursor:pointer;font-size:.83rem;}
.btn-delete{padding:8px 12px;border:none;border-radius:7px;background:var(--warnbg);color:var(--warn);cursor:pointer;font-size:.83rem;margin-right:auto;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo" style="color:#58a6ff;">🏥 KSH · ห้องผ่าตัด</div>
    <div class="login-title">OR Elective Schedule</div>
    <div class="login-sub">กรุณาใส่รหัสเข้าใช้งาน</div>
    <input class="login-input" id="pwInput" type="password" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-err" id="pwErr"></div>
    <button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen" style="display:none;">
  <div class="spinner" id="loadSpinner"></div>
  <div style="color:var(--muted);font-size:.83rem;" id="loadMsg">กำลังโหลด…</div>
</div>

<!-- APP -->
<div class="app" id="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="dept-badge" id="deptBadge"></span>
      <span class="topbar-title" id="topTitle"></span>
    </div>
    <div class="topbar-right">
      <span class="sync-msg" id="syncMsg"></span>
      <span class="sync-txt"><span class="sync-dot" id="syncDot" style="background:#3d4550"></span><span id="syncTxt">กำลังเชื่อมต่อ…</span></span>
      <button class="btn-sm" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <div class="tab active" id="tabMy" onclick="switchTab('my')">📋 ตารางของฉัน</div>
    <div class="tab" id="tabCentral" onclick="switchTab('central')">🏥 ตารางรวม</div>
  </div>

  <!-- MY SCHEDULE TAB -->
  <div class="tab-content show" id="contentMy">
    <div class="controls">
      <div class="ctrl-group">
        <div class="ctrl-label">เดือน</div>
        <div class="month-nav">
          <button class="nav-btn" onclick="shiftMonth(-1)">‹</button>
          <div id="monthLabel" class="month-label"></div>
          <button class="nav-btn" onclick="shiftMonth(1)">›</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">สัปดาห์</div>
        <div id="weekBtns" class="pill-row"></div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">วัน</div>
        <div id="dayBtns" class="pill-row"></div>
      </div>
      <button class="btn-ghost" onclick="exportDay()">📋 Export</button>
    </div>
    <div class="conflict-banner" id="conflictBanner">⚠️ มีความขัดแย้ง! แพทย์ถูก assign ซ้อนทับกัน</div>
    <div id="slotGrid" class="slot-grid"></div>
    <div id="summarySection"></div>
  </div>

  <!-- CENTRAL VIEW TAB -->
  <div class="tab-content" id="contentCentral">
    <div class="controls">
      <div class="ctrl-group">
        <div class="ctrl-label">เดือน</div>
        <div class="month-nav">
          <button class="nav-btn" onclick="shiftMonthC(-1)">‹</button>
          <div id="monthLabelC" class="month-label"></div>
          <button class="nav-btn" onclick="shiftMonthC(1)">›</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">สัปดาห์</div>
        <div id="weekBtnsC" class="pill-row"></div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">วัน</div>
        <div id="dayBtnsC" class="pill-row"></div>
      </div>
    </div>
    <div id="centralGrid" class="central-grid"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">➕ เพิ่ม Operation<span class="modal-sub" id="modalSub"></span></div>
    <div class="conflict-msg" id="modalConflict"></div>
    <div class="form-row">
      <label class="form-label">แพทย์</label>
      <select class="fsel" id="fDoc" onchange="onDocChange()"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Diagnosis</label>
      <input class="fsel" id="fDiag" type="text" placeholder="พิมพ์ diagnosis..." style="background:var(--bg);">
    </div>
    <div class="form-row">
      <label class="form-label">Operation</label>
      <select class="fsel" id="fOp" onchange="onOpSel()"></select>
      <input class="finput" id="fOpCustom" type="text" placeholder="พิมพ์ชื่อ operation...">
    </div>
    <div class="form-row">
      <label class="form-label">ช่วงเวลา</label>
      <div class="time-grid">
        <div><div style="font-size:.63rem;color:var(--muted);margin-bottom:3px;">เริ่ม</div><select class="fsel" id="fStart" onchange="onTimeChange()"></select></div>
        <div><div style="font-size:.63rem;color:var(--muted);margin-bottom:3px;">สิ้นสุด</div><select class="fsel" id="fEnd" onchange="onTimeChange()"></select></div>
      </div>
      <div class="dur-hint" id="durHint"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-delete" id="btnDel" style="display:none" onclick="deleteOp()">ลบ</button>
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-primary" onclick="saveOp()">บันทึก</button>
    </div>
  </div>
</div>

<script>
// ── FIREBASE ──────────────────────────────────────────
const FB = "https://orksh-840b3-default-rtdb.asia-southeast1.firebasedatabase.app";
async function fbGet(p){ const r=await fetch(`${FB}/${p}.json`); return r.json(); }
async function fbSet(p,d){ await fetch(`${FB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}); }

// ── DOCTOR CONFIG ─────────────────────────────────────
const DEPT_NAMES={obstetrics:"OB-GYN",surgery:"ศัลยกรรม",orthopedics:"ออร์โธปีดิกส์",ophthalmology:"จักษุ",neurosurgery:"ศัลย์ประสาท",maxillo:"Maxillo"};
const DEPT_COLORS={obstetrics:"#f78166",surgery:"#58a6ff",orthopedics:"#3fb950",ophthalmology:"#e3b341",neurosurgery:"#d2a8ff",maxillo:"#79c0ff"};
const DEPT_BG={obstetrics:"rgba(247,129,102,.15)",surgery:"rgba(88,166,255,.15)",orthopedics:"rgba(63,185,80,.15)",ophthalmology:"rgba(227,179,65,.15)",neurosurgery:"rgba(210,168,255,.15)",maxillo:"rgba(121,192,255,.15)"};
const DEPT_OPS={
  obstetrics:["Cesarean section","Hysterectomy","Myomectomy","Ovarian cystectomy","Salpingectomy","MVA","D&C","Cervical conization","Tubal ligation","Endometrial biopsy","อื่นๆ (พิมพ์เอง)"],
  surgery:["Appendectomy","Cholecystectomy","Herniorrhaphy","Colostomy","Gastrectomy","Splenectomy","Thyroidectomy","Bowel resection","อื่นๆ (พิมพ์เอง)"],
  orthopedics:["ORIF femur","THR","TKR","ACL repair","Laminectomy","Spine fusion","Arthroscopy","Amputation","อื่นๆ (พิมพ์เอง)"],
  ophthalmology:["Cataract extraction","Trabeculectomy","Vitrectomy","Strabismus repair","Pterygium excision","อื่นๆ (พิมพ์เอง)"],
  neurosurgery:["Craniotomy","VP shunt","Laminectomy","Discectomy","Tumor resection","อื่นๆ (พิมพ์เอง)"],
  maxillo:["Jaw osteotomy","Cleft lip repair","Cleft palate repair","Mandible fracture fixation","อื่นๆ (พิมพ์เอง)"]
};
const SESSION_TIMES={am:{start:8*60+30,end:12*60},pm:{start:13*60,end:16*60}};
const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์"];
const THAI_MONTHS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

const ADMIN_ID="Admin";
const ALL_DOCTOR_NAMES=["พญ.ระพีพรรณ","นพ.เกียรติพร","พญ.อารีรัตน์","นพ.วีระพงศ์","นพ.พิษณุ","นพ.กันต์ชนะ","นพ.ภัทรพล","นพ.กฤษฎาภร","นพ.บุญยกร","พ.อารียา","พ.ฤทธ์","พญ.ทัชชา","นพ.จารุสิทธิ์","พญ.วิชญาพร","นพ.ธีรศักดิ์","นพ.ณัฐวัฒน์","พญ.ชัชฎาภรณ์","พญ.ณัฐนรี","พญ.ภคินี"];
const ALL_ROOMS=["OR-1","OR-2","OR-3","OR-4"];
const ALL_SESSIONS=[{id:"am",label:"☀ เช้า"},{id:"pm",label:"🌤 บ่าย"}];

// Admin user object — all days, all rooms, all doctors
const ADMIN_USER={
  id:ADMIN_ID, password:"Admin01",
  names:ALL_DOCTOR_NAMES,
  dept:"surgery", // used for color only
  isAdmin:true,
  slots:[0,1,2,3,4].flatMap(d=>ALL_ROOMS.flatMap(room=>["am","pm"].map(session=>({room,day:d,session}))))
};

const DOCTORS=[
  {id:"Ob1",password:"Ob1",names:["พญ.ระพีพรรณ","นพ.เกียรติพร","พญ.อารีรัตน์"],dept:"obstetrics",slots:[{room:"OR-1",day:0,session:"pm"},{room:"OR-3",day:1,session:"pm"},{room:"OR-2",day:2,session:"am"},{room:"OR-1",day:2,session:"pm"},{room:"OR-3",day:3,session:"am"},{room:"OR-2",day:4,session:"pm"}]},
  {id:"Ob2",password:"Ob2",names:["นพ.วีระพงศ์"],dept:"obstetrics",slots:[{room:"OR-1",day:0,session:"am"},{room:"OR-1",day:4,session:"am"}]},

// ── STATE ─────────────────────────────────────────────
let currentUser=null, opsData={}, saveTimer=null, editId=null, modalSlot=null;

// Start from June 29 2026 = Monday, month index 5 (June)
const _now=new Date();
const START_YEAR=2026, START_MONTH=5; // June = month index 5

// If today >= June 29 2026 → use today's month, else use June 2026
const START_DATE=new Date(2026,5,29); // June 29 2026
const _afterStart = _now >= START_DATE;
let curYear  = _afterStart ? _now.getFullYear() : START_YEAR;
let curMonth = _afterStart ? _now.getMonth()    : START_MONTH;
let cYear    = curYear,  cMonth = curMonth;

// current week/day
let curWeek=0, curDay=0, cWeek=0, cDay=0;

// ── HELPERS ──────────────────────────────────────────
const minToTime=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const fmtDur=m=>{const h=Math.floor(m/60),mn=m%60;return h>0?(mn>0?`${h}ชม.${mn}น.`:`${h}ชม.`):`${mn}น.`;};
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function overlaps(a,b){return !(a.endMin<=b.startMin||a.startMin>=b.endMin);}

function weeksInMonth(y,m){
  let d=new Date(y,m,1);
  while(d.getDay()!==1)d.setDate(d.getDate()+1);
  let c=0;const last=new Date(y,m+1,0);
  while(d<=last){c++;d.setDate(d.getDate()+7);}
  return Math.max(c,1);
}
function getDate(y,m,w,d){
  let dt=new Date(y,m,1);
  while(dt.getDay()!==1)dt.setDate(dt.getDate()+1);
  dt.setDate(dt.getDate()+w*7+d);return dt;
}
function weekRange(y,m,w){
  const mon=getDate(y,m,w,0),fri=getDate(y,m,w,4);
  return `${mon.getDate()}–${fri.getDate()}`;
}
function findTodayWeek(y,m,targetDate){
  const td=targetDate||_now.getDate();
  const today=new Date(y,m,td);
  let d=new Date(y,m,1);
  while(d.getDay()!==1)d.setDate(d.getDate()+1);
  for(let w=0;w<6;w++){
    const fri=new Date(d);fri.setDate(fri.getDate()+6);
    if(today>=d&&today<=fri)return w;
    d.setDate(d.getDate()+7);
  }
  return 0;
}
function todayDayIdx(){const j=_now.getDay();return(j===0||j===6)?0:j-1;}

const fbPath=()=>`schedule/${curYear}_${curMonth}_${curWeek}_${curDay}`;
const fbPathFor=(y,m,w,d)=>`schedule/${y}_${m}_${w}_${d}`;

const curOps=()=>getOps(`${curYear}_${curMonth}_${curWeek}_${curDay}`);

async function loadAllData(){
  try{
    const data=await fbGet('schedule');
    opsData=data||{};
    setConn(true);
  }catch(e){
    setConn(false);
    try{const r=localStorage.getItem('or-sched-bk');if(r)opsData=JSON.parse(r);}catch(e2){}
  }
  document.getElementById('loadingScreen').style.display='none';

  // setup dept color on app
  const dc=currentUser.isAdmin?'#58a6ff':DEPT_COLORS[currentUser.dept];
  const db=currentUser.isAdmin?'rgba(88,166,255,.15)':DEPT_BG[currentUser.dept];
  document.documentElement.style.setProperty('--dc',dc);
  document.documentElement.style.setProperty('--db',db);

  document.getElementById('deptBadge').textContent=currentUser.isAdmin?'🔑 Admin':DEPT_NAMES[currentUser.dept];
  document.getElementById('deptBadge').style.borderColor=dc;
  document.getElementById('deptBadge').style.background=db;
  document.getElementById('deptBadge').style.color=dc;
  document.getElementById('topTitle').textContent=currentUser.isAdmin?'ผู้ดูแลระบบ':currentUser.names.join(' · ');

  // init week/day: if today >= June 29 2026 use today, else use week containing June 29
  if(_afterStart){
    curWeek=findTodayWeek(curYear,curMonth);
    curDay=todayDayIdx();
    cWeek=curWeek; cDay=curDay;
  } else {
    // land on the week containing June 29 2026, day = Monday (index 0)
    curWeek=findTodayWeek(START_YEAR,START_MONTH,29);
    curDay=0; cWeek=curWeek; cDay=0;
  }

  document.getElementById('app').classList.add('show');
  renderMyTab();
  renderCentralTab();

  // poll every 8s
  setInterval(async()=>{
    try{const d=await fbGet('schedule');opsData=d||{};setConn(true);renderMyTab();renderCentralTab();}
    catch(e){setConn(false);}
  },8000);
}

function shiftMonth(dir){
  curMonth+=dir;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  // clamp to START
  if(curYear<START_YEAR||(curYear===START_YEAR&&curMonth<START_MONTH)){curYear=START_YEAR;curMonth=START_MONTH;}
  curWeek=0;renderMyTab();
}
function shiftMonthC(dir){
  cMonth+=dir;
  if(cMonth>11){cMonth=0;cYear++;}
  if(cMonth<0){cMonth=11;cYear--;}
  if(cYear<START_YEAR||(cYear===START_YEAR&&cMonth<START_MONTH)){cYear=START_YEAR;cMonth=START_MONTH;}
  cWeek=0;renderCentralTab();
}
function setWeek(w){curWeek=w;renderMyTab();}
function setDay(d){curDay=d;renderMyTab();}
function setWeekC(w){cWeek=w;renderCentralTab();}
function setDayC(d){cDay=d;renderCentralTab();}

// ── BUILD CONTROLS ────────────────────────────────────
function buildMonthWeekNav(y,m,w,btnId,labelId){
  document.getElementById(labelId).textContent=`${THAI_MONTHS[m]} ${y+543}`;
  const total=weeksInMonth(y,m);
  const ww=Math.min(w,total-1);
  return Array.from({length:total},(_,i)=>
    `<button class="pill${i===ww?' active':''}" onclick="${btnId}(${i})">สัปดาห์ ${i+1}<br><span style="font-size:.62rem;opacity:.7">${weekRange(y,m,i)}</span></button>`
  ).join('');
}
function buildDayNav(y,m,w,d,fn){
  return DAYS.map((l,i)=>{
    const dt=getDate(y,m,w,i);
    return `<button class="pill${i===d?' active':''}" onclick="${fn}(${i})">${l}<br><span style="font-size:.62rem;opacity:.7">${dt.getDate()}</span></button>`;
  }).join('');
}

      const s=allSlots.filter(sl=>sl.day===d);
      const isToday=d===curDay;
      infoHtml+=`<div style="background:var(--surface2);border:1px solid ${isToday?dc:'var(--border)'};border-radius:7px;padding:7px 12px;min-width:100px;flex:1;">
        <div style="font-size:.75rem;font-weight:700;color:${isToday?dc:'var(--text)'};margin-bottom:5px;">${DAYS[d]}</div>`;
      if(!s.length){
        infoHtml+=`<div style="font-size:.7rem;color:var(--border2);font-style:italic;">ไม่มี slot</div>`;
      } else {
        s.forEach(sl=>{

        });

  if(daySlots.length===0){
    html+=`<div style="color:var(--muted);font-size:.85rem;padding:20px 0;text-align:center;">ไม่มี OR slot วันนี้</div>`;
  } else {
    daySlots.forEach(sl=>{
      const st=SESSION_TIMES[sl.session];
      const label=sl.session==='am'?`☀ เช้า ${minToTime(st.start)}–${minToTime(st.end)}`:`🌤 บ่าย ${minToTime(st.start)}–${minToTime(st.end)}`;
      const slotOps=ops.filter(o=>o.room===sl.room&&o.session===sl.session);
      const key=`${sl.room}_${sl.session}`;
      html+=`<div class="slot-card">

            <span class="slot-time">${label}</span>

    let html='';
    Object.entries(DEPT_NAMES).forEach(([deptId,deptName])=>{
      const docs=DOCTORS.filter(d=>d.dept===deptId).flatMap(d=>d.names);
      if(!docs.length)return;
      html+=`<optgroup label="${deptName}">`;
      docs.forEach(n=>{ html+=`<option value="${n}">${n}</option>`; });
      html+=`</optgroup>`;
    });
    sel.innerHTML=html;
  } else {
    sel.innerHTML=currentUser.names.map(n=>`<option value="${n}">${n}</option>`).join('');
  }
}
function buildOpSelect(){
  // if admin, use dept of selected doctor; else use currentUser.dept
  let dept=currentUser.dept;
  if(currentUser.isAdmin){
    const doc=document.getElementById('fDoc').value;
    dept=getDeptFromDoctor(doc)||'surgery';
  }
  const ops=DEPT_OPS[dept]||[];
  document.getElementById('fOp').innerHTML=ops.map(o=>`<option value="${o}">${o}</option>`).join('');
  document.getElementById('fOpCustom').style.display='none';
}
function onDocChange(){
  if(currentUser.isAdmin) buildOpSelect();
  checkConflict();
}
function onOpSel(){
  const v=document.getElementById('fOp').value;
  const isCustom=v==='อื่นๆ (พิมพ์เอง)';
  document.getElementById('fOpCustom').style.display=isCustom?'block':'none';
  if(isCustom){document.getElementById('fOpCustom').value='';document.getElementById('fOpCustom').focus();}
}
function getOpVal(){
  const v=document.getElementById('fOp').value;
  if(v==='อื่นๆ (พิมพ์เอง)'){const c=document.getElementById('fOpCustom').value.trim();return c||null;}
  return v;
}
function setOpVal(val){
  const dept=currentUser.isAdmin?getDeptFromDoctor(document.getElementById('fDoc').value):currentUser.dept;
  const ops=DEPT_OPS[dept]||[];
  const sel=document.getElementById('fOp');
  if(ops.includes(val)){sel.value=val;document.getElementById('fOpCustom').style.display='none';}
  else{sel.value='อื่นๆ (พิมพ์เอง)';document.getElementById('fOpCustom').style.display='block';document.getElementById('fOpCustom').value=val;}
}

function buildTimeSelects(session,defS,defE){
  const st=SESSION_TIMES[session];
  const startOpts=[],endOpts=[];
  for(let m=st.start;m<st.end;m+=30)startOpts.push(m);   // start: 08:30–15:30
  for(let m=st.start+30;m<=st.end;m+=30)endOpts.push(m); // end: 09:00–16:00
  const fs=document.getElementById('fStart'),fe=document.getElementById('fEnd');
  fs.innerHTML=startOpts.map(m=>`<option value="${m}">${minToTime(m)}</option>`).join('');
  fe.innerHTML=endOpts.map(m=>`<option value="${m}">${minToTime(m)}</option>`).join('');
  fs.value=defS; fe.value=defE;
}
function onTimeChange(){
  const s=+document.getElementById('fStart').value,e=+document.getElementById('fEnd').value;
  const h=document.getElementById('durHint');
  if(e>s){h.textContent='⏱ '+fmtDur(e-s);h.style.color=DEPT_COLORS[currentUser.dept];}
  else{h.textContent='⚠ เวลาสิ้นสุดต้องมากกว่าเวลาเริ่ม';h.style.color='#f78166';}
  checkConflict();
}
function checkConflict(){
  const s=+document.getElementById('fStart').value,e=+document.getElementById('fEnd').value;
  const doc=document.getElementById('fDoc').value;
  const el=document.getElementById('modalConflict');
  if(e<=s||!doc){el.classList.remove('show');return;}
  const ops=curOps();
  const conflict=ops.some(o=>o.id!==editId&&o.doctor===doc&&overlaps({startMin:s,endMin:e},o));
  if(conflict){el.textContent=`⚠️ ${doc} มี operation ซ้อนทับในช่วงนี้`;el.classList.add('show');}
  else el.classList.remove('show');
}

function saveOp(){
  const s=+document.getElementById('fStart').value,e=+document.getElementById('fEnd').value;
  if(e<=s){alert('เวลาสิ้นสุดต้องมากกว่าเวลาเริ่ม');return;}
  const opVal=getOpVal();
  if(!opVal){alert('กรุณาระบุชื่อ operation');return;}
  const diag=document.getElementById('fDiag').value.trim();
  const k=`${curYear}_${curMonth}_${curWeek}_${curDay}`;
  let ops=getOps(k);
  const doc=document.getElementById('fDoc').value;
  if(editId){
    ops=ops.map(o=>o.id===editId?{...o,doctor:doc,diagnosis:diag,op:opVal,startMin:s,endMin:e}:o);
  }else{
    ops=[...ops,{id:genId(),room:modalSlot.room,session:modalSlot.session,doctor:doc,diagnosis:diag,op:opVal,startMin:s,endMin:e}];
  }
  opsData[k]=ops;
  scheduleSave();closeModal();renderMyTab();renderCentralTab();
}
function deleteOp(){
  const k=`${curYear}_${curMonth}_${curWeek}_${curDay}`;
  opsData[k]=getOps(k).filter(o=>o.id!==editId);
  scheduleSave();closeModal();renderMyTab();renderCentralTab();
}

// ── EXPORT ────────────────────────────────────────────
function exportDay(){
  const ops=[...curOps()].sort((a,b)=>a.startMin-b.startMin);
  const dt=getDate(curYear,curMonth,curWeek,curDay);
  let txt=`=== OR Schedule วัน${DAYS[curDay]} ${dt.getDate()} ${THAI_MONTHS[dt.getMonth()]} ${dt.getFullYear()+543} ===\n\n`;
  const daySlots=currentUser.slots.filter(s=>s.day===curDay);
  daySlots.forEach(sl=>{
    const sOps=ops.filter(o=>o.room===sl.room&&o.session===sl.session);
    if(!sOps.length)return;
    const st=SESSION_TIMES[sl.session];
    txt+=`[ ${sl.room} · ${sl.session==='am'?'เช้า':'บ่าย'} ${minToTime(st.start)}–${minToTime(st.end)} ]\n`;
    sOps.forEach(o=>txt+=`  ${minToTime(o.startMin)}–${minToTime(o.endMin)}  ${o.doctor}  ${o.op}  (${fmtDur(o.endMin-o.startMin)})\n`);
    txt+='\n';
  });
  navigator.clipboard.writeText(txt).then(()=>showSync('✓ คัดลอกแล้ว','#3fb950')).catch(()=>alert(txt));
}

document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
</script>
